</div>
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Cards</title>
  <link rel="stylesheet" type="text/css" href="../style/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
  <div class="row game-container">
    <div class="column side">
      <div class="actions" style="width: 65px; justify-content: left;">
        <button onclick="history.back();">⬅</button>
      </div>
    </div>
    <div class="column middle">
      <img src="../images/logo.png" alt="Logo" class="mini-logo">
      <div class="grid-container"></div>
    </div>
    <div class="column side">
      <p>⏳ <span class="time"></span></p>
      <p>Score: <span class="score"></span></p>
      <div class="actions">
        <button onclick="restart();">Restart</button>
      </div>
    </div>
  </div>
  <div id="gameOverModal">
    <div class="game-modal-content">
      <h2>GAME  OVER</h2>
      <p>Score</p>
      <p id="finalScore"></p>
      <div class="actions">
        <button onclick="restart()"><i class="fa-solid fa-rotate-left"></i></button>
        <button onclick="goToLeaderboard()"><i class="fa-solid fa-chart-column"></i></button>
        <button onclick="history.back();"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </div>
  </div>
  <div id="gameOverModalLose">
    <div class="game-modal-content">
      <h2>Time's Up ⌛️</h2>
      <div class="actions">
        <button onclick="restart()"><i class="fa-solid fa-rotate-left"></i></button>
        <button onclick="goToLeaderboard()"><i class="fa-solid fa-chart-column"></i></button>
        <button onclick="history.back();"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </div>
  </div>
  <script type="module" src="../scripts/game.js"></script>
  <script>
    window.goToLeaderboard = function () {
    getLeaderboard().then((leaderboardData) => {
        window.location.href = 'board.html';
    }).catch((error) => {
        console.error("Veri çekme hatası:", error);
    });
}
  </script>
</body>

</html>
