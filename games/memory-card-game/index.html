<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Card Game</title>
  <link rel="stylesheet" type="text/css" href="style/style.css" />
</head>

<body>

  <div id="nameModal">
    <div class="modal-content">
      <h2>Enter Nickname</h2>
      <div class="actions">
        <input type="text" id="playerName" placeholder="Nickname">
        <button id="startButton">Start</button>
      </div>
    </div>
  </div>

  <div id="gameContent" class="hidden">
    <div class="row">
      <h1 class="header">Memory Cards</h1>
      <div class="actions">
        <button onclick="selectDifficulty('easy');">Easy</button>
        <button onclick="selectDifficulty('normal');">Normal</button>
        <button onclick="selectDifficulty('hard');">Hard</button>
      </div>
    </div>
</body>
<script type="module" src="firebase.js"></script>
<script type="module" src="main.js"></script>
</html>
